files_to_modify:
  - file: components/VideoAnnotator/VideoAnnotator.tsx
    change: add the canvas drawing overlay, toolbar, legend, and export

design_decisions:
  - decision: Export is a composited PNG of the current frame + annotations, not a re-encoded annotated video
    rationale: No video-encoding library is installed; adding one (e.g. ffmpeg.wasm) is a heavy dependency at odds with this repo's Vercel-bandwidth-conscious posture -- out of scope for this epic

risks:
  - severity: medium
    description: Keeping annotation coordinates correctly aligned with the underlying video frame across zoom/pan/resize is a real geometry bug risk
    mitigation: Acceptance criteria explicitly test alignment under a zoomed/panned state, not just the unzoomed default

