    - path: components/VideoTour/VideoTour.tsx
      purpose: "Precedent for this repo's client-component + manifest-resolution pattern (fetch if URL, use directly if object) — mirror the shape, not the domain logic."

files_to_modify:
  - file: components/LayerViewer/LayerViewer.tsx
    change: "Create"
  - file: components/LayerViewer/LayerControl.tsx
    change: "Create"
  - file: components/LayerViewer/index.ts
    change: "Create — public export surface"

do_not:
  - "Do not implement MeasureTool, AnnotationLayer, CompareSwipe, or AlignControl — Phase 2, out of scope."
  - "Do not add gating/auth logic to the component — stays gate-agnostic, mirrors VideoTour's precedent."
  - "Do not wire real thermal imagery or invent fake thermal data — the stub stays inert."
  - "Do not use the PMTiles path (pmtiles package) — this epic's data scale doesn't need it (see design discussion); raw COG protocol is the right choice here."
