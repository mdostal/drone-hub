    description: The correct MapLibre-native swipe-compare technique is genuinely unknown at planning time -- guessing wrong could mean a rebuild mid-story
    mitigation: Research step is explicitly sequenced first and must confirm the technique before implementation starts, not discover the wrong approach mid-implementation

