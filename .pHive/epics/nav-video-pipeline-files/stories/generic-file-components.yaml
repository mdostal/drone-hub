      purpose: The header comment explicitly prohibiting withBasePath() inside portable library components — the exact rule the file-viewer component must follow.
    - path: "app/(showcase)/components/layer-viewer/page.tsx"
      purpose: The precedent for calling withBasePath() at the showcase-page call site, not inside the component.
    - path: lib/layer-types.ts
