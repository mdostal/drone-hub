files_to_modify:
  - file: components/FileUpload/
    change: New component + showcase page + doc.
  - file: components/FileList/
    change: New component (or FileViewer/ — final name decided during implementation) + showcase page + doc.
  - file: components/ProcessingStatus/
    change: New component + showcase page + doc.
  - file: app/page.tsx
    change: Add 3 new ToC entries.

design_decisions:
  - decision: One top-level directory per component, matching existing convention.
    rationale: This repo has no precedent for a shared components/Files/ grouping directory; matching the existing pattern (components/LayerViewer/, components/Model3D/) is more consistent than introducing a new one.
  - decision: File-viewer takes already-resolved URLs, no internal basePath awareness.
    rationale: "Grill finding #2: lib/base-path.ts explicitly prohibits this inside portable components; basePath resolution belongs at the showcase-page call site."

risks:
  - severity: high
    description: This is the epic's single highest scope-boundary risk, given this exact ambiguity already triggered a real correction earlier in this project.
    mitigation: Explicit, repeated scope-boundary language throughout this story; the review step's #1 job is re-verifying it against actual code, not trusting the implementer's self-report.
