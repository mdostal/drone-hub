design_decisions:
  - decision: No manual map.resize() call.
    rationale: "Grill-verified directly against maplibre-gl's source: trackResize defaults true, a real ResizeObserver already handles container resizes automatically."
  - decision: Fullscreen targets the outer wrapper, not containerRef.
    rationale: "Grill finding #3: the loading/error overlays are siblings of containerRef, not descendants — targeting containerRef would hide them during fullscreen."
  - decision: /pipeline is documentation-only in this story, no working conversion script.
    rationale: CLAUDE.md's Phase-0 nadir-pass gate means there's no real WebODM output to test a script against yet.

risks:
  - severity: low
    description: A tempting scope expansion is to also build a real conversion script.
    mitigation: Explicitly out of scope per this story's acceptance criteria — flag and stop if an implementing agent starts building one.
