  - id: implement
    description: Execute all 8 steps above as one coherent change — source/generate the new dataset, extend LayerDef, update LayerViewer.tsx, update land-overlay's duck anchor, update manifest.test.ts.
    agent: developer
    depends_on: [behavior-spec]
  - id: test
    description: Run/derive tests; live-verify via Playwright that the new imagery renders correctly, thermal/contours are visually distinct, and the duck is correctly positioned.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm all 8 sub-items actually landed together (not partially), the style field is genuinely additive, and the sample data documentation was updated to describe the new real source.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit on feat/brand-theming-and-viewer-polish.
    agent: developer
    depends_on: [review]

