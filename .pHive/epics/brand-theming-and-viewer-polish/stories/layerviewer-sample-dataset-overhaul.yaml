id: layerviewer-sample-dataset-overhaul
epic: brand-theming-and-viewer-polish
title: Regenerate one coherent sample dataset (real ortho + matched-scale hillshade/thermal/contours + realigned boundary/duck)
status: complete
complexity: high
methodology: bdd
depends_on: []

description: |
  READ .pHive/epics/brand-theming-and-viewer-polish/docs/design-discussion.md
  §3b IN FULL before starting — including its "Revised after grill" preamble.
  This is not a "swap one file" story. The current sample ortho.tif is a
  rio-tiler test fixture — single-band uint16, not real RGB imagery — which
  is why it renders as a near-solid-black shape on /components/land-overlay
  today (confirmed live). The existing hillshade.tif is ALSO wrong for this
  purpose in a way that isn't visually obvious: it's continental-scale
  (522x549px over a ~1000km x 950km extent, ~1823 m/pixel — verified
  directly with rasterio during grill review), while parcel.geojson's
  rectangle is ~120m x 100m — about 1/15th of a SINGLE hillshade pixel.
  Deriving new "thermal"/"contours" layers from that existing array (a
  tempting shortcut) would produce geometrically nonsensical output at
  parcel scale. Do not do that.

  This story generates ONE new, internally-consistent sample dataset at a
  new real small-scale location, all together:

  1. Source a real, small-scale, genuinely visual 3-band RGB ortho — a
     public-domain small-area aerial/drone orthophoto (e.g. a cropped USGS
     NAIP tile, public domain, ~0.6-1m resolution; or another
     permissively-licensed small real orthomosaic). Reproject to EPSG:3857
     (rio warp + rio cogeo create/validate — the established convention
     from this session's COG-bounds-bug fix). Whatever real small extent
     this imagery naturally covers becomes the new sample location — do
     NOT force it to the old ~73.47°N Arctic coordinates or invent a fake
     address. Document the real source/license in
     docs/components/layer-viewer.md's "Sample data provenance" section
     (existing convention — follow the exact documentation pattern already
     used for ortho.tif/hillshade.tif/parcel.geojson there).
  2. Generate a NEW synthetic hillshade/DEM at the SAME extent/resolution
     as the new ortho (rasterio/numpy procedural elevation field →
     hillshade render, same technique as the existing hillshade.tif's
     generation, just correctly scaled this time — do not reuse the old
     continental-scale array).
  3. Generate the thermal layer from an INDEPENDENTLY-VARIED synthetic
     intensity field (a separate procedural pass — NOT the literal same
     array the hillshade step uses; two layers colorized from one
     identical source would show identical ridgelines under different
     palettes when toggled, which is an obvious tell, not two distinct
     layers), LUT-mapped through an ironbow colormap (black → purple → red
     → orange → yellow → white) at the new extent. Update layers.json's
     thermal entry: disabled: false, url: "thermal.tif", legend stays
     "synthetic placeholder — not real radiometric data" (exact existing
     wording convention, do not invent new phrasing), toggle: false by
     default.
  4. Add a contours layer — derive real contour lines from the NEW,
     correctly-scaled DEM (skimage.measure.find_contours or equivalent,
     converting pixel space to the COG's real geo-coordinates) as a
     GeoJSON MultiLineString/LineString FeatureCollection. Add scikit-image
     as a one-time data-prep dependency (not a runtime npm dependency —
     matches this repo's existing "pipeline tools live outside the
     bundle" pattern; the generation script itself should NOT be
     committed, matching the established throwaway-script convention used
     for the original hillshade generation).
  5. Regenerate parcel.geojson as a placeholder rectangle within the NEW
     ortho's real extent (same "centered on the ortho, synthetic
     placeholder, not a real parcel" convention as today — just
     re-anchored to the new location).
  6. Update app/(showcase)/components/land-overlay/page.tsx's
     SAMPLE_MODELS duck lat/lon to sit inside the new extent. This is a
     REQUIRED cascading change, not optional — CLAUDE.md's own "#1
     registration gate" (boundary + ortho + model all register to one
     grid) breaks if this is skipped.
  7. Extend lib/layer-types.ts's LayerDef with an optional style field
     (fill color, line color, or a lineOnly: boolean flag) and update
     components/LayerViewer/LayerViewer.tsx's buildLayerMapConfig to use
     it — contours render as thin accent-colored lines with NO fill
     (lineOnly), distinct from the boundary's existing green fill+line
     treatment. This must be additive: every existing LayerDef object
     (all 5 showcase pages, the manifest.test.ts fixtures) must keep
     working with zero changes when style is absent — verify this
     directly, don't just assume optional-field additivity holds.
  8. Update public/layer-viewer-samples/2806-prado/manifest.test.ts's TWO
     hardcoded assertions that this change breaks: the
     "matches CBA's exact thermal stub shape" test (currently asserts
     disabled: true, url: null — now false/non-null) and the
     "has exactly the four expected layer ids" test (now five, with
     "contours" added). Rewrite both to match the new manifest shape —
     do not just delete them; they exist to catch drift and should keep
     doing so for the new shape.

  Once all of the above lands, re-verify (via Playwright against a real
  running dev server) that /components/layer-viewer and
  /components/land-overlay both render a genuinely recognizable, non-black
  aerial image by default, with the duck visible and correctly positioned
  on /components/land-overlay, and that toggling hillshade/thermal/contours
  on/off each shows visually distinct content.

acceptance_criteria:
  - "Given /components/layer-viewer loaded fresh, when the page renders, then the default view shows real, recognizable aerial imagery — not a black or near-black shape (verified via a real screenshot, not just an HTTP 200)"
  - "Given the thermal layer toggled on, when rendered, then it shows an ironbow-colormap image that is visually DISTINCT from the hillshade layer (not the same terrain pattern in a different palette)"
  - "Given the contours layer toggled on, when rendered, then it shows thin line geometry (no fill) that is visually plausible as elevation contours within the visible parcel extent, not invisible or spanning far outside the frame"
  - "Given /components/land-overlay loaded fresh, when the page renders, then the sample duck is visible and sits within the new ortho's real extent (verified via map.project() numeric check against the new parcel/duck coordinates, mirroring the land-overlay epic's original numeric-verification method — not just a visual glance)"
  - "Given lib/layer-types.ts's LayerDef.style field, when an existing LayerDef object with no style field is passed through buildLayerMapConfig, then it renders identically to before this story (green fill+line for geojson, unchanged raster handling) — zero behavior change for the absent case"
  - "Given public/layer-viewer-samples/2806-prado/manifest.test.ts, when run, then it passes against the NEW 5-layer manifest shape, not the old 4-layer one, and its assertions still meaningfully catch drift (not just loosened to always pass)"
  - "Given the full test suite and a real npm run build, when run after this story, then both pass cleanly with the new sample data and all 7 /docs/components/<slug> + / routes still prerender static"

