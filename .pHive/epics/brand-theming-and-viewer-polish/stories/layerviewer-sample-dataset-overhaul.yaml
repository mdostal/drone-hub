design_decisions:
  - decision: Generate one new coherent dataset at a new real location, not patch the existing arctic/continental-scale files.
    rationale: "Grill findings #2 and #3: real sourced RGB imagery won't be at the old Arctic coordinates (breaking parcel/duck alignment if only ortho is swapped), and the existing hillshade.tif is continental-scale, unusable as a source for parcel-scale thermal/contours."
  - decision: Thermal and contours derive from independently-varied synthetic sources, not one shared array.
    rationale: "Grill finding #4: sharing one source would make toggling between them show identical terrain under different treatments."
  - decision: LayerDef gets an optional style field rather than hardcoding a second special case by layer id.
    rationale: Keeps the "typed layer registry" contract (CBA's own stated design goal) genuinely extensible for any future geojson layer, not just contours.

risks:
  - severity: high
    description: Sourcing a real, good-looking, rights-safe small-scale RGB ortho is the epic's highest-uncertainty item — may not find an ideal pre-packaged COG.
    mitigation: "Documented fallback per design-discussion.md's risk section: generate a clearly-labeled synthetic-but-photographic-looking ortho (e.g. a real public-domain aerial photo, even if not already COG-ified, converted via rio cogeo create) rather than blocking on finding a perfect pre-made COG."

