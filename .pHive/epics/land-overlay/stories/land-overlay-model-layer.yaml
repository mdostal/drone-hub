files_to_modify:
  - file: lib/geo-model-types.ts
    change: "Create"
  - file: lib/maplibre-model-layer.ts
    change: "Create"

do_not:
  - "Do not inline this logic into components/LayerViewer/LayerViewer.tsx — it must be its own module, per the design review's correction."
  - "Do not reuse or alias components/Model3D/Model3D.tsx's ModelDef type — GeoAnchoredModel is genuinely different."
  - "Do not use @react-three/fiber/drei here — a MapLibre custom layer must use raw three.js, r3f assumes it owns the render loop."
  - "Do not skip renderer.resetState() — required, not optional."
