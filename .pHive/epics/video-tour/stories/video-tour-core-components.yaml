do_not:
  - "Do not implement neighbor preloading here — that's video-tour-neighbor-preload's job; this story's job is correct render/navigate behavior first."
  - "Do not implement hls.js playback or wire real spin/transition clips — P1 has none; the spin/clip code paths must exist structurally but are unexercised until P2."
  - "Do not add gating logic to the component itself — it stays gate-agnostic per the design discussion; gating is video-tour-gating-middleware's responsibility."
  - "Do not deviate from the prototype's UX (transition timing, Ken-Burns feel, doorway button styling) without flagging it — 'the prototype IS the spec.'"
